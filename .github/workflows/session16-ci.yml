name: Session 16 - Final CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "session-16-github-actions/**"
      - ".github/workflows/session16-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-16-github-actions/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: session-16-github-actions/session-16-github-actions/10-final-cicd-pipeline

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build application
        run: |
          chmod +x build.sh
          ./build.sh
          cat build/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: session-16-github-actions/session-16-github-actions/10-final-cicd-pipeline/build/

  security-check:
    name: Security Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for sensitive files
        run: |
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .; then
            echo "Potential sensitive file found."
            exit 1
          fi
          echo "No common sensitive files found."

  # ---------------- CD ----------------
  docker-push:
    name: CD - Build & Push Image (GHCR)
    needs: [build, security-check]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (uses the GITHUB_TOKEN secret)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (tests run inside the build)
        run: docker build -t ghcr.io/${{ github.repository_owner }}/session16-calculator:${{ github.sha }} .

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/session16-calculator:${{ github.sha }}

  deploy:
    name: CD - Deploy & Smoke Test
    needs: docker-push
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the released image from the registry
        run: docker pull ghcr.io/${{ github.repository_owner }}/session16-calculator:${{ github.sha }}

      - name: Smoke test the released image
        run: |
          docker run -i --rm ghcr.io/${{ github.repository_owner }}/session16-calculator:${{ github.sha }} < sample-input.txt | tee out.txt
          grep -q "Result: 15.0" out.txt
          grep -q "Cannot divide by zero" out.txt
          echo "Deployed image works."
