# ConfigMap exists, but the Pod asks for a key that isn't in it
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-settings
data:
  log-level: debug
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-config
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo LOG_LEVEL=$LOG_LEVEL; sleep 3600"]
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-settings
              key: LOG_LEVEL
