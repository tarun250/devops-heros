# Mounts a ConfigMap that does not exist -> Pod stuck in ContainerCreating
apiVersion: v1
kind: Pod
metadata:
  name: stuck-creating
spec:
  containers:
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html
  volumes:
    - name: site
      configMap:
        name: site-content
