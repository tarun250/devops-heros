groups:
  - name: demo-app
    rules:
      - alert: AppDown
        expr: up{job="demo-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "demo-app is not being scraped (down)"

      - alert: HighErrorRate
        expr: >
          100 * sum by (endpoint) (rate(app_requests_total{status="500"}[1m]))
          / sum by (endpoint) (rate(app_requests_total[1m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests to {{ $labels.endpoint }} are failing"

      - alert: HighLatencyP95
        expr: >
          histogram_quantile(0.95, sum by (le) (rate(app_request_duration_seconds_bucket{endpoint="/order"}[1m]))) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency of /order is above 500 ms"

      - alert: HighCPU
        expr: rate(process_cpu_seconds_total{job="demo-app"}[1m]) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "demo-app is using more than 80% of one CPU"
